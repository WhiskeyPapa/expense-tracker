<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-visual">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Expenses">
<title>Expenses</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.11.0/dist/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>

<style>
  :root {
    --bg: #0f0f1a;
    --bg2: #1c1c28;
    --bg3: #1a1a2e;
    --border: rgba(255,255,255,0.07);
    --muted: #7a7a9a;
    --text: #ffffff;
    --accent: #4848ee;

    --c-food: #4cd97b;
    --c-baby: #fb923c;
    --c-home: #2dd4bf;
    --c-bills: #4a9eff;
    --c-care: #ff6b6b;
    --c-fun: #facc15;
    --c-transport: #c084fc;
    --c-others: #888888;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
    max-width: 430px;
    margin: 0 auto;
    min-height: 100dvh;
    overflow-x: hidden;
    padding-bottom: 100px;
  }

  /* ── PWA STANDALONE SAFE AREA ── */
  body.pwa {
    padding-top: 62px;
  }
  body.pwa #s-transactions.active {
    bottom: calc(65px + env(safe-area-inset-bottom, 0px));
  }
  body.pwa .bnav {
    padding-bottom: 34px;
  }
  body.pwa #sat-spacer {
    padding-top: env(safe-area-inset-top, 62px);
  }

  button, .cat-btn, .np-btn, .add-btn, .bnav-btn, .mnav-btn, .del-btn {
    touch-action: manipulation;
  }
  .chip { touch-action: manipulation; }

  .cat-btn, .np-btn, .add-btn, .chip, .tx-row, .bnav-btn {
    -webkit-user-select: none;
    user-select: none;
  }

  /* ── NAV ── */
  .bnav {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 430px;
    display: flex; justify-content: space-around; align-items: center;
    padding-top: 10px;
    padding-bottom: 10px;
    background: var(--bg);
    border-top: 0.5px solid var(--border);
    z-index: 100;
  }
  .bnav-btn {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-size: 10px; color: var(--muted); cursor: pointer;
    background: none; border: none; padding: 4px 16px;
    transition: color 0.15s;
  }
  .bnav-btn i { font-size: 22px; }
  .bnav-btn.on { color: var(--accent); }

  /* ── SCREENS ── */
  .screen { display: none; padding: 0; }
  .screen.active {
    display: block;
    padding-top: 0;
    padding-bottom: 100px;
  }

  /* edit overlay wrapper configuration */
  #s-edit.active {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    overflow-y: auto;
    max-width: 430px;
    margin: 0 auto;
    padding-top: env(safe-area-inset-top, 0px);
    background: var(--bg);
    z-index: 150;
  }

  /* Hide bottom navigation bar completely when edit screen is open */
  body:has(#s-edit.active) .bnav {
    display: none !important;
  }

  body.pwa #s-edit.active {
    padding-top: env(safe-area-inset-top, 62px);
  }

  #s-transactions { display: none; }
  #s-transactions.active {
    display: block;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 65px;
    overflow-y: scroll;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-y: none;
    max-width: 430px;
    margin: 0 auto;
  }

  .tx-sticky {
    position: sticky;
    top: 0;
    z-index: 50;
    background: #0f0f1a;
    border-bottom: none;
    padding-bottom: 0px;
    box-shadow: 0 -100px 0 100px #0f0f1a;
  }

  .month-sticky {
    position: sticky;
    top: 0; 
    z-index: 40;
    background: #0f0f1a;
    padding: 6px 18px 8px;
  }

  /* ── OVERVIEW ── */
  .total-card {
    margin: 20px 18px 18px;
    background: var(--bg2);
    border-radius: 20px;
    padding: 20px;
    text-align: center;
  }
  .total-card .lbl { font-size: 11px; color: rgba(255,255,255,0.45); letter-spacing: 0.05em; margin-bottom: 8px; }
  .total-card .amt { font-size: 32px; font-weight: 500; letter-spacing: -0.5px; }

  .add-section-lbl {
    padding: 0 18px 6px;
    font-size: 12px; font-weight: 500;
    color: rgba(255,255,255,0.3);
    letter-spacing: 0.05em; text-transform: uppercase;
  }
  .amount-display {
    text-align: center; padding: 10px 18px 10px;
  }
  .amount-display .cur { font-size: 16px; color: var(--muted); }
  .amount-display .num { font-size: 40px; font-weight: 500; letter-spacing: -1px; }

  .cat-grid {
    display: grid; grid-template-columns: repeat(5,1fr);
    gap: 8px; padding: 0 18px 12px;
  }
  .cat-btn {
    background: var(--bg3); border-radius: 12px;
    padding: 10px 2px; display: flex; flex-direction: column;
    align-items: center; gap: 4px; font-size: 11px;
    color: var(--muted); border: 1.5px solid transparent;
    cursor: pointer; transition: none;
  }
  .cat-btn i { font-size: 17px; }
  .cat-btn.sel { border-color: currentColor; }

  .note-field {
    margin: 0 18px 10px;
    background: var(--bg3); border-radius: 12px;
    padding: 10px 14px; font-size: 13px;
    color: var(--text); border: none; width: calc(100% - 36px);
    outline: none;
  }
  .note-field::placeholder { color: var(--muted); }

  .numpad {
    display: grid; grid-template-columns: repeat(3,1fr);
    gap: 5px; padding: 0 18px 10px;
  }
  .np-btn {
    background: var(--bg3); border-radius: 10px;
    padding: 12px 7px; font-size: 16px; font-weight: 500;
    color: var(--text); border: none; cursor: pointer;
    text-align: center; transition: background 0.1s;
  }
  .np-btn:active { background: #2a2a45; }

  .add-btn {
    margin: 0 18px 20px;
    background: var(--bg2); border-radius: 14px;
    padding: 15px; font-size: 15px; font-weight: 500;
    color: rgba(255,255,255,0.6); text-align: center;
    cursor: pointer; border: none; width: calc(100% - 36px);
    transition: opacity 0.15s;
  }
  .add-btn.ready { background: var(--accent); color: #fff; }
  .add-btn:active { opacity: 0.8; }

  .divider { margin: 0 18px; height: 0.5px; background: var(--border); }

  .pie-wrap { display: flex; justify-content: center; padding: 20px 18px 16px; }
  .legend { padding: 0 18px 16px; display: flex; flex-direction: column; gap: 12px; }
  .leg-row { display: flex; justify-content: space-between; align-items: center; }
  .leg-left { display: flex; align-items: center; gap: 8px; }
  .leg-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
  .leg-name { font-size: 13px; color: #ccc; }
  .leg-right { display: flex; gap: 8px; align-items: center; }
  .leg-pct { font-size: 11px; color: var(--muted); }
  .leg-amt { font-size: 13px; font-weight: 500; }
  .cb-track { height: 4px; background: rgba(255,255,255,0.08); border-radius: 2px; margin-top: 5px; overflow: hidden; }
  .cb-fill { height: 100%; border-radius: 2px; }
  .empty-state { text-align: center; padding: 40px 18px; color: var(--muted); font-size: 14px; }
  #tx-search::placeholder { color: #7a7a9a; }
  #tx-search::-webkit-search-cancel-button { -webkit-appearance: none; }
  .chips {
    display: flex;
    flex-direction: row;
    gap: 8px;
    padding: 4px 18px 6px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-x;
  }
  .chips::-webkit-scrollbar { display: none; }
  html::-webkit-scrollbar { display: none; }
  html { scrollbar-width: none; -ms-overflow-style: none; }
  body::-webkit-scrollbar { display: none; }
  body { scrollbar-width: none; -ms-overflow-style: none; }
  #s-transactions::-webkit-scrollbar { display: none; }
  #s-transactions { scrollbar-width: none; -ms-overflow-style: none; }
  .chip {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 8px 10px; border-radius: 14px; font-size: 11px; font-weight: 500;
    white-space: nowrap; border: 1.5px solid transparent; flex-shrink: 0;
    cursor: pointer; touch-action: manipulation;
  }
  .chip i { font-size: 16px; }

  .month-hdr {
    display: flex; justify-content: space-between; align-items: center;
  }
  .month-hdr .m-lbl { font-size: 15px; font-weight: 500; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
  .month-hdr .m-amt { font-size: 15px; font-weight: 500; }

  .swipe-wrap { position: relative; overflow: hidden; }
  .tx-row {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 18px;
    border-bottom: 0.5px solid var(--border);
    background: var(--bg);
    transition: transform 0.25s ease;
    cursor: pointer; user-select: none; position: relative;
  }
  .tx-row.swiped { transform: translateX(-72px); }
  .tx-row.highlight-lock { transform: translateX(0px) !important; pointer-events: none; }
  .tx-ico {
    width: 36px; height: 36px; border-radius: 11px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }
  .tx-info { flex: 1; min-width: 0; }
  .tx-name { font-size: 13px; font-weight: 500; }
  .tx-note { font-size: 11px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tx-right { text-align: right; flex-shrink: 0; }
  .tx-amt { font-size: 11px; font-weight: 500; color: #ff6b6b; }
  .tx-date { font-size: 10px; color: var(--muted); margin-top: 2px; }
  .del-btn {
    position: absolute; right: 0; top: 0; bottom: 0; width: 72px;
    background: #E24B4A; display: flex; align-items: center;
    justify-content: center; flex-direction: column; gap: 3px;
    font-size: 10px; color: #fff; font-weight: 500; cursor: pointer;
    border: none;
  }
  .del-btn i { font-size: 18px; }
  .edit-action-btn {
    position: absolute; left: 0; top: 0; bottom: 0; width: 72px;
    background: #4848ee; display: flex; align-items: center;
    justify-content: center; flex-direction: column; gap: 3px;
    font-size: 10px; color: #fff; font-weight: 500; cursor: pointer;
    border: none;
  }
  .edit-action-btn i { font-size: 18px; }
  .tx-row.swiped-right { transform: translateX(72px); }

  /* ── REPORTS ── */
  .month-nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 18px 16px;
  }
  .mnav-btn {
    background: var(--bg2); border: none; border-radius: 10px;
    padding: 8px 14px; color: var(--text); cursor: pointer; font-size: 16px;
  }
  .sec-lbl {
    padding: 0 18px 8px;
    font-size: 12px; font-weight: 500;
    color: rgba(255,255,255,0.3);
    letter-spacing: 0.05em; text-transform: uppercase;
  }
  .compare-card {
    margin: 0 18px 18px; background: var(--bg2);
    border-radius: 16px; padding: 16px;
  }
  .compare-row { display: flex; align-items: center; justify-content: space-between; }
  .compare-col { display: flex; flex-direction: column; gap: 2px; }
  .compare-col.right { text-align: right; }
  .compare-col .c-lbl { font-size: 10px; color: var(--muted); }
  .compare-col .c-val { font-size: 20px; font-weight: 500; }
  .compare-divider { width: 1px; height: 40px; background: rgba(255,255,255,0.1); }
  .compare-footer { margin-top: 12px; padding-top: 10px; border-top: 0.5px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .badge { display: inline-flex; align-items: center; gap: 3px; padding: 3px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; }
  .badge.up { background: rgba(255,107,107,0.15); color: #ff6b6b; }
  .badge.down { background: rgba(76,217,123,0.15); color: #4cd97b; }
  .badge.flat { background: rgba(255,255,255,0.08); color: var(--muted); }

  .sum-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 18px 18px; }
  .sum-card { background: var(--bg2); border-radius: 16px; padding: 14px 16px; }
  .sum-card .s-lbl { font-size: 10px; color: var(--muted); margin-bottom: 5px; }
  .sum-card .s-val { font-size: 18px; font-weight: 500; }

  .chg-up { color: #ff6b6b; font-size: 10px; display: flex; align-items: center; gap: 2px; }
  .chg-down { color: #4cd97b; font-size: 10px; display: flex; align-items: center; gap: 2px; }
  .chg-flat { color: var(--muted); font-size: 10px; }

  .toast {
    position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
    background: var(--accent); color: #fff;
    padding: 8px 20px; border-radius: 20px; font-size: 13px;
    z-index: 999; pointer-events: none;
    animation: fadeup 0.2s ease;
  }
  @keyframes fadeup { from { opacity:0; transform: translateX(-50%) translateY(8px); } to { opacity:1; transform: translateX(-50%) translateY(0); } }

  /* ── DATE RANGE SEARCH ── */
  .search-row { display: flex; gap: 8px; margin: 0 18px 0px; align-items: center; }
  .search-bar-inner { flex: 1; background: #1c1c28; border-radius: 12px; padding: 8px 14px; display: flex; align-items: center; gap: 8px; }
  .search-bar-inner i { font-size: 16px; color: var(--muted); flex-shrink: 0; }
  .search-bar-inner input { background: none; border: none; outline: none; color: var(--text); font-size: 13px; width: 100%; -webkit-appearance: none; }
  .search-bar-inner input::placeholder { color: var(--muted); }
  .cal-icon-btn { background: #1c1c28; border: 1.5px solid transparent; border-radius: 12px; padding: 8px 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
  .cal-icon-btn i { font-size: 18px; color: var(--muted); }
  .cal-icon-btn.active { border-color: var(--accent); }
  .cal-icon-btn.active i { color: var(--accent); }
  .date-range-bar { display: none; margin: 0 18px 10px; background: #1c1c28; border-radius: 12px; padding: 10px 14px; align-items: center; gap: 10px; }
  .date-range-bar.visible { display: flex; }
  .dr-side { display: flex; flex-direction: column; gap: 2px; flex: 1; cursor: pointer; }
  .dr-side.right { text-align: right; }
  .dr-lbl { font-size: 10px; color: var(--muted); }
  .dr-val { font-size: 12px; font-weight: 500; color: var(--text); }
  .dr-val.placeholder { color: var(--muted); }
  .dr-divider { width: 1px; height: 28px; background: rgba(255,255,255,0.1); flex-shrink: 0; }
  .dr-clear { font-size: 11px; color: #ff6b6b; display: flex; align-items: center; gap: 3px; cursor: pointer; flex-shrink: 0; }

  /* ── DATE PICKER ── */
  .date-field {
    margin: 0 18px 10px;
    background: var(--bg3);
    border-radius: 12px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border: 1.5px solid transparent;
    cursor: pointer;
  }
  .date-field.open { border-color: var(--accent); }
  .date-field-lbl { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .date-field-val { font-size: 13px; font-weight: 500; color: var(--text); }
  .cal-sheet {
    display: none;
    position: fixed;
    bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 430px;
    background: var(--bg2);
    border-radius: 20px 20px 0 0;
    padding: 16px 18px 32px;
    z-index: 200;
    box-shadow: 0 -4px 30px rgba(0,0,0,0.5);
  }
  .cal-sheet.visible { display: block; }
  .cal-handle { width: 36px; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; margin: 0 auto 14px; }
  .cal-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .cal-nav-btn { background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; padding: 4px 8px; }
  .cal-nav span { font-size: 14px; font-weight: 500; color: var(--text); }
  .cal-day-hdrs { display: grid; grid-template-columns: repeat(7,1fr); margin-bottom: 4px; }
  .cal-day-hdr { text-align: center; font-size: 10px; color: var(--muted); padding: 2px 0; }
  .cal-days { display: grid; grid-template-columns: repeat(7,1fr); gap: 2px; }
  .cal-day { text-align: center; font-size: 12px; padding: 8px 2px; border-radius: 8px; color: var(--muted); cursor: default; }
  .cal-day.past { color: #ccc; cursor: pointer; }
  .cal-day.past:active { background: rgba(72,72,238,0.2); }
  .cal-day.today { color: var(--accent); font-weight: 600; cursor: pointer; }
  .cal-day.sel { background: var(--accent); color: #fff; font-weight: 600; border-radius: 50%; cursor: pointer; }
  .cal-day.future { color: #333; }
  .cal-day.in-range { background: rgba(72,72,238,0.15); color: #ccc; border-radius: 4px; }
  .cal-confirm { margin-top: 14px; background: var(--accent); border: none; border-radius: 12px; padding: 13px; font-size: 14px; font-weight: 500; color: #fff; width: 100%; cursor: pointer; }
  .cal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 199; }
  .cal-backdrop.visible { display: block; }
</style>
</head>
<body>

<div class="screen active" id="s-overview">
  <div class="total-card">
    <div class="lbl">TOTAL SPENT THIS MONTH</div>
    <div class="amt" id="ov-total">NT$0</div>
  </div>

  <div class="add-section-lbl">Add expense</div>
  <div class="amount-display">
    <span class="cur">NT$ </span><span class="num" id="amt-display">0</span>
  </div>

  <div class="cat-grid" id="cat-grid"></div>

  <div class="date-field" id="date-field" onclick="openCal()">
    <div class="date-field-lbl"><i class="ti ti-calendar" style="font-size:14px;"></i>Date</div>
    <div class="date-field-val" id="date-field-val">Today</div>
  </div>
  <input class="note-field" id="note-input" type="text" placeholder="Note (optional)" maxlength="60">

  <div class="numpad">
    <button class="np-btn" onclick="np('1')">1</button>
    <button class="np-btn" onclick="np('2')">2</button>
    <button class="np-btn" onclick="np('3')">3</button>
    <button class="np-btn" onclick="np('4')">4</button>
    <button class="np-btn" onclick="np('5')">5</button>
    <button class="np-btn" onclick="np('6')">6</button>
    <button class="np-btn" onclick="np('7')">7</button>
    <button class="np-btn" onclick="np('8')">8</button>
    <button class="np-btn" onclick="np('9')">9</button>
    <button class="np-btn" onclick="np('00')">00</button>
    <button class="np-btn" onclick="np('0')">0</button>
    <button class="np-btn" onclick="npDel()"><i class="ti ti-backspace"></i></button>
  </div>

  <button class="add-btn" id="add-btn" onclick="addExpense()">ADD EXPENSE1</button>

  <div class="divider"></div>
  <div class="pie-wrap"><canvas id="ov-pie" width="220" height="220"></canvas></div>
  <div class="legend" id="ov-legend"></div>
</div>

<div class="screen" id="s-edit">
  <div style="padding:20px 18px 8px;display:flex;align-items:center;justify-content:space-between;">
    <button onclick="closeEdit()" style="background:#1c1c28;border:none;border-radius:10px;padding:8px 14px;color:#fff;font-size:14px;display:flex;align-items:center;gap:6px;cursor:pointer;"><i class="ti ti-arrow-left" aria-hidden="true"></i> Back</button>
    <span style="font-size:16px;font-weight:500;color:#fff;">Edit expense</span>
    <button onclick="saveEdit()" style="background:#4848ee;border:none;border-radius:10px;padding:8px 14px;color:#fff;font-size:13px;font-weight:500;cursor:pointer;">Save</button>
  </div>
  <div style="text-align:center;padding:12px 18px 10px;">
    <span style="font-size:16px;color:#7a7a9a;">NT$ </span><span id="edit-display" style="font-size:40px;font-weight:500;color:#fff;letter-spacing:-1px;">0</span>
  </div>
  <div class="cat-grid" id="edit-cat-grid"></div>
  <input class="note-field" id="edit-note" type="text" placeholder="Note (optional)" maxlength="60">
  <div class="numpad">
    <button class="np-btn" onclick="enp('1')">1</button>
    <button class="np-btn" onclick="enp('2')">2</button>
    <button class="np-btn" onclick="enp('3')">3</button>
    <button class="np-btn" onclick="enp('4')">4</button>
    <button class="np-btn" onclick="enp('5')">5</button>
    <button class="np-btn" onclick="enp('6')">6</button>
    <button class="np-btn" onclick="enp('7')">7</button>
    <button class="np-btn" onclick="enp('8')">8</button>
    <button class="np-btn" onclick="enp('9')">9</button>
    <button class="np-btn" onclick="enp('00')">00</button>
    <button class="np-btn" onclick="enp('0')">0</button>
    <button class="np-btn" onclick="enpDel()"><i class="ti ti-backspace"></i></button>
  </div>
</div>

// ── SNAPSHOT LISTENERS ──
onSnapshot(query(collection(db,'expenses')), snap => {

// ── OVERVIEW RENDER ──
function renderOverview() {
  const now = new Date();
  const mExps = expenses.filter(e => e.date.getMonth()===now.getMonth() && e.date.getFullYear()===now.getFullYear());
  const total = mExps.reduce((sum,e)=>sum+e.amount,0);
  document.getElementById('ov-total').textContent = 'NT$' + total.toLocaleString();

  const catsum = {};
  CATS.forEach(c=>catsum[c.id]=0);
  mExps.forEach(e=>{ if(catsum[e.category]!==undefined) catsum[e.category]+=e.amount; });

  const data = []; const colors = []; const labels = [];
  CATS.forEach(c=>{
    if(catsum[c.id]>0){
      data.push(catsum[c.id]); colors.push(c.color); labels.push(c.label);
    }
  });

  if (ovPieChart) ovPieChart.destroy();
  const ctx = document.getElementById('ov-pie').getContext('2d');
  if (data.length === 0) {
    ovPieChart = new Chart(ctx, {
      type: 'doughnut',
      data: { datasets: [{ data: [1], backgroundColor: ['rgba(255,255,255,0.05)'], borderWidth: 0 }] },
      options: { cutout: '78%', plugins: { datalabels: { display: false }, tooltip: { enabled: false } } }
    });
    document.getElementById('ov-legend').innerHTML = `<div class="empty-state">No expenses recorded this month</div>`;
    return;
  }

  ovPieChart = new Chart(ctx, {
    type: 'doughnut',
    data: { labels, datasets: [{ data, backgroundColor: colors, borderWidth: 0 }] },
    options: {
      cutout: '78%',
      plugins: {
        legend: { display: false },
        tooltip: { enabled: false },
        datalabels: { display: false }
      }
    }
  });

  let legHtml = '';
  const sorted = CATS.map(c=>({ ...c, amt:catsum[c.id] })).filter(x=>x.amt>0).sort((a,b)=>b.amt-a.amt);
  sorted.forEach(c => {
    const pct = ((c.amt/total)*100).toFixed(0) + '%';
    legHtml += `
      <div>
        <div class="leg-row">
          <div class="leg-left">
            <div class="leg-dot" style="background:${c.color}"></div>
            <span class="leg-name">${c.label}</span>
          </div>
          <div class="leg-right">
            <span class="leg-pct">${pct}</span>
            <span class="leg-amt">NT$${c.amt.toLocaleString()}</span>
          </div>
        </div>
        <div class="cb-track"><div class="cb-fill" style="background:${c.color};width:${pct}"></div></div>
      </div>`;
  });
  document.getElementById('ov-legend').innerHTML = legHtml;
}

// ── TRANSACTIONS RENDER ──
let swipeStartX = 0;
let swipeStartY = 0;
let activeSwipeRow = null;
let currentSwipeDir = null;

function renderTx() {
  const list = document.getElementById('tx-list');
  let filtered = [...expenses];

  if (txFilter !== 'all') {
    filtered = filtered.filter(e => e.category === txFilter);
  }
  if (txSearch) {
    filtered = filtered.filter(e => {
      const nMatch = e.note && e.note.toLowerCase().includes(txSearch);
      const aMatch = e.amount.toString().includes(txSearch);
      return nMatch || aMatch;
    });
  }
  if (dateFrom && dateTo) {
    const f = new Date(dateFrom); f.setHours(0,0,0,0);
    const t = new Date(dateTo); t.setHours(23,59,59,999);
    filtered = filtered.filter(e => e.date >= f && e.date <= t);
  }

  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty-state">No transactions match your filters</div>`;
    return;
  }

  const groups = {};
  filtered.forEach(e => {
    const mStr = e.date.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    if (!groups[mStr]) groups[mStr] = { label: mStr, amt: 0, items: [] };
    groups[mStr].amt += e.amount;
    groups[mStr].items.push(e);
  });

  let html = '';
  Object.values(groups).forEach(g => {
    html += `
      <div class="month-sticky">
        <div class="month-hdr">
          <span class="m-lbl">${g.label}</span>
          <span class="m-amt">NT$${g.amt.toLocaleString()}</span>
        </div>
      </div>`;
    g.items.forEach(e => {
      const c = CAT_MAP[e.category] || { label: 'Others', icon: 'ti-dots-circle-horizontal', color: '#888' };
      const dStr = e.date.toLocaleDateString('en-US', { day: 'numeric', month: 'short' });
      html += `
        <div class="swipe-wrap">
          <button class="edit-action-btn" onclick="openEdit('${e.id}')"><i class="ti ti-edit"></i>Edit</button>
          <div class="tx-row" data-id="${e.id}">
            <div class="tx-ico" style="background:${c.color}15;color:${c.color};"><i class="ti ${c.icon}"></i></div>
            <div class="tx-info">
              <div class="tx-name">${c.label}</div>
              <div class="tx-note">${e.note || ''}</div>
            </div>
            <div class="tx-right">
              <div class="tx-amt">-NT$${e.amount.toLocaleString()}</div>
              <div class="tx-date">${dStr}</div>
            </div>
          </div>
          <button class="del-btn" onclick="deleteTx('${e.id}')"><i class="ti ti-trash"></i>Delete</button>
        </div>`;
    });
  });
  list.innerHTML = html;

  // Touch handlers for swipe to actions
  const rows = list.querySelectorAll('.tx-row');
  rows.forEach(r => {
    r.addEventListener('touchstart', e => {
      if(r.classList.contains('highlight-lock')) return;
      swipeStartX = e.touches[0].clientX;
      swipeStartY = e.touches[0].clientY;
      activeSwipeRow = r;
      currentSwipeDir = null;
    }, { passive: true });

    r.addEventListener('touchmove', e => {
      if (!activeSwipeRow || activeSwipeRow !== r) return;
      const dx = e.touches[0].clientX - swipeStartX;
      const dy = e.touches[0].clientY - swipeStartY;

      if (!currentSwipeDir) {
        if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 10) {
          currentSwipeDir = dx > 0 ? 'right' : 'left';
        } else if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 10) {
          activeSwipeRow = null;
          return;
        }
      }

      if (currentSwipeDir === 'left' && dx < 0) {
        r.style.transform = `translateX(${Math.max(-72, dx)}px)`;
      } else if (currentSwipeDir === 'right' && dx > 0) {
        r.style.transform = `translateX(${Math.min(72, dx)}px)`;
      }
    }, { passive: true });

    r.addEventListener('touchend', e => {
      if (!activeSwipeRow || activeSwipeRow !== r) return;
      const dx = e.changedTouches[0].clientX - swipeStartX;
      r.style.transform = '';
      if (currentSwipeDir === 'left' && dx < -35) {
        r.classList.remove('swiped-right');
        r.classList.add('swiped');
      } else if (currentSwipeDir === 'right' && dx > 35) {
        r.classList.remove('swiped');
        r.classList.add('swiped-right');
      } else {
        r.classList.remove('swiped', 'swiped-right');
      }
      activeSwipeRow = null;
    });
  });
}

// ── REPORTS RENDER ──
function renderRpt() {
  const mLabel = rptDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  document.getElementById('rpt-month-lbl').textContent = mLabel;

  const curM = rptDate.getMonth(); const curY = rptDate.getFullYear();
  const prevDate = new Date(curY, curM - 1, 1);
  const prevM = prevDate.getMonth(); const prevY = prevDate.getFullYear();

  const curExps = expenses.filter(e => e.date.getMonth()===curM && e.date.getFullYear()===curY);
  const prevExps = expenses.filter(e => e.date.getMonth()===prevM && e.date.getFullYear()===prevY);

  const curTotal = curExps.reduce((sum,e)=>sum+e.amount,0);
  const prevTotal = prevExps.reduce((sum,e)=>sum+e.amount,0);

  let diffHtml = '';
  if (prevTotal === 0) {
    diffHtml = `<span class="badge flat">Flat</span><span>No data for previous month</span>`;
  } else {
    const diffPct = ((curTotal - prevTotal) / prevTotal) * 100;
    if (diffPct > 0) {
      diffHtml = `<span class="badge up"><i class="ti ti-trending-up"></i>+${diffPct.toFixed(0)}%</span><span>More than last month</span>`;
    } else if (diffPct < 0) {
      diffHtml = `<span class="badge down"><i class="ti ti-trending-down"></i>${diffPct.toFixed(0)}%</span><span>Less than last month</span>`;
    } else {
      diffHtml = `<span class="badge flat">Flat</span><span>Same as last month</span>`;
    }
  }

  document.getElementById('rpt-compare').innerHTML = `
    <div class="compare-row">
      <div class="compare-col">
        <span class="c-lbl">LAST MONTH</span>
        <span class="c-val" style="color:var(--muted)">NT$${prevTotal.toLocaleString()}</span>
      </div>
      <div class="compare-divider"></div>
      <div class="compare-col right">
        <span class="c-lbl">THIS MONTH</span>
        <span class="c-val">NT$${curTotal.toLocaleString()}</span>
      </div>
    </div>
    <div class="compare-footer">${diffHtml}</div>`;

  const txCount = curExps.length;
  const avg = txCount > 0 ? Math.round(curTotal / txCount) : 0;
  
  let highCat = 'None'; let highAmt = 0;
  const catsum = {}; mCurExpenses(curExps, catsum);
  Object.entries(catsum).forEach(([cid,amt])=>{
    if(amt>highAmt){ highAmt=amt; highCat=CAT_MAP[cid]?.label||'Others'; }
  });

  document.getElementById('rpt-summary').innerHTML = `
    <div class="sum-card"><div class="s-lbl">AVERAGE / EXPENSE</div><div class="s-val">NT$${avg.toLocaleString()}</div></div>
    <div class="sum-card"><div class="s-lbl">TOP CATEGORY</div><div class="s-val" style="font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${highCat}</div></div>`;

  let legHtml = '';
  const sorted = CATS.map(c=>({ ...c, amt:catsum[c.id]||0 })).filter(x=>x.amt>0).sort((a,b)=>b.amt-a.amt);
  sorted.forEach(c => {
    const pct = ((c.amt/curTotal)*100).toFixed(0) + '%';
    legHtml += `
      <div>
        <div class="leg-row">
          <div class="leg-left">
            <div class="leg-dot" style="background:${c.color}"></div>
            <span class="leg-name">${c.label}</span>
          </div>
          <div class="leg-right">
            <span class="leg-pct">${pct}</span>
            <span class="leg-amt">NT$${c.amt.toLocaleString()}</span>
          </div>
        </div>
        <div class="cb-track"><div class="cb-fill" style="background:${c.color};width:${pct}"></div></div>
      </div>`;
  });
  document.getElementById('rpt-legend').innerHTML = legHtml || `<div class="empty-state">No data available</div>`;

  // Trend Chart logic
  const trendLabels = []; const trendData = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(curY, curM - i, 1);
    trendLabels.push(d.toLocaleDateString('en-US', { month: 'short' }));
    const mExps = expenses.filter(e => e.date.getMonth()===d.getMonth() && e.date.getFullYear()===d.getFullYear());
    trendData.push(mExps.reduce((sum,e)=>sum+e.amount,0));
  }

  if (rptLineChart) rptLineChart.destroy();
  const ctxLine = document.getElementById('rpt-line').getContext('2d');
  rptLineChart = new Chart(ctxLine, {
    type: 'line',
    data: {
      labels: trendLabels,
      datasets: [{
        data: trendData,
        borderColor: '#4848ee',
        borderWidth: 2,
        pointBackgroundColor: '#4848ee',
        pointRadius: 3,
        tension: 0.1,
        fill: false
      }]
    },
    options: {
      scales: { x: { grid: { display: false }, ticks: { color: '#7a7a9a', font: { size: 10 } } }, y: { display: false } },
      plugins: {
        legend: { display: false },
        tooltip: { enabled: false },
        datalabels: {
          align: 'top',
          color: '#fff',
          font: { size: 9, weight: '500' },
          formatter: (v) => v > 0 ? 'NT$' + Math.round(v).toLocaleString() : ''
        }
      }
    }
  });
}

function mCurExpenses(curExps, catsum) {
  CATS.forEach(c=>catsum[c.id]=0);
  curExps.forEach(e=>{ if(catsum[e.category]!==undefined) catsum[e.category]+=e.amount; });
}

window.rptChangeMonth = (dir) => {
  rptDate.setMonth(rptDate.getMonth() + dir);
  renderRpt();
};

// ── EXPENSE MUTATION ──
window.addExpense = async () => {
  const amt = parseInt(amtStr||'0',10);
  if (!amt) { toast('Enter an amount'); return; }
  if (!selCat) { toast('Pick a category'); return; }
  const note = document.getElementById('note-input').value.trim();

  // Clear keyboard if input is active
  if (document.activeElement) document.activeElement.blur();

  try {
    await addDoc(collection(db, 'expenses'), {
      amount: amt,
      category: selCat,
      note: note,
      date: selectedDate
    });
    toast('Added successfully!');
    amtStr = ''; selCat = null;
    document.getElementById('note-input').value = '';
    updateAmtDisplay();
    selectCat(null);
  } catch(e) { toast('Error saving'); console.error(e); }
};

// ── NAVIGATION INTERACTION ──
window.switchTab = (tabId, btn) => {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('s-' + tabId).classList.add('active');

  document.querySelectorAll('.bnav-btn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');

  if (tabId === 'transactions') {
    renderTx();
    setTimeout(() => {
      const topBar = document.getElementById('tx-sticky-bar');
      const monthHeaders = document.querySelectorAll('.month-sticky');
      if (topBar && monthHeaders.length > 0) {
        const h = topBar.offsetHeight;
        monthHeaders.forEach(hdr => hdr.style.top = (h - 1) + 'px');
      }
    }, 50);
  }
};

// ── DATE SELECTOR CALENDAR SHEET ──
let calTempDate = new Date();
window.openCal = () => {
  calTempDate = new Date(selectedDate);
  document.getElementById('date-field').classList.add('open');
  document.getElementById('cal-backdrop').classList.add('visible');
  document.getElementById('cal-sheet').classList.add('visible');
  renderCalGrid();
};

window.closeCal = () => {
  document.getElementById('date-field').classList.remove('open');
  document.getElementById('cal-backdrop').classList.remove('visible');
  document.getElementById('cal-sheet').classList.remove('visible');
};

window.calChangeMonth = (dir) => {
  calTempDate.setMonth(calTempDate.getMonth() + dir);
  renderCalGrid();
};

window.selectCalDay = (y,m,d) => {
  selectedDate = new Date(y,m,d);
  const now = new Date();
  const lbl = selectedDate.toDateString() === now.toDateString() ? 'Today' : selectedDate.toLocaleDateString('en-US', { day:'numeric', month:'short', year:'numeric' });
  document.getElementById('date-field-val').textContent = lbl;
  closeCal();
};

function renderCalGrid() {
  const year = calTempDate.getFullYear(); const month = calTempDate.getMonth();
  document.getElementById('cal-month-lbl').textContent = calTempDate.toLocaleDateString('en-US', { month:'long', year:'numeric' });
  
  const firstDay = new Date(year, month, 1).getDay();
  const numDays = new Date(year, month + 1, 0).getDate();
  const now = new Date(); now.setHours(0,0,0,0);

  let html = '';
  for (let i = 0; i < firstDay; i++) { html += '<div></div>'; }
  for (let d = 1; d <= numDays; d++) {
    const cur = new Date(year, month, d);
    let cls = 'cal-day past';
    if (cur > now) cls = 'cal-day future';
    else if (cur.getTime() === now.getTime()) cls = 'cal-day today';
    
    if (cur.toDateString() === selectedDate.toDateString()) cls += ' sel';

    const click = cur <= now ? `onclick="selectCalDay(${year},${month},${d})"` : '';
    html += `<div class="${cls}" ${click}>${d}</div>`;
  }
  document.getElementById('cal-days').innerHTML = html;
}

// ── DATE RANGE PICKER (TRANSACTIONS VIEW) ──
window.toggleDateRange = () => {
  const bar = document.getElementById('date-range-bar');
  const btn = document.getElementById('cal-icon-btn');
  bar.classList.toggle('visible');
  btn.classList.toggle('active');
  
  setTimeout(() => {
    const topBar = document.getElementById('tx-sticky-bar');
    const monthHeaders = document.querySelectorAll('.month-sticky');
    if (topBar && monthHeaders.length > 0) {
      const h = topBar.offsetHeight;
      monthHeaders.forEach(hdr => hdr.style.top = (h - 1) + 'px');
    }
  }, 20);

  if(!bar.classList.contains('visible')) {
    clearDateRange();
  }
};

window.openDateRangePicker = (target) => {
  datePickTarget = target;
  calTempDate = target === 'from' ? (dateFrom ? new Date(dateFrom) : new Date()) : (dateTo ? new Date(dateTo) : new Date());
  document.getElementById('cal-backdrop').classList.add('visible');
  document.getElementById('cal-sheet').classList.add('visible');
  renderRangeCalGrid();
};

window.clearDateRange = () => {
  dateFrom = null; dateTo = null;
  document.getElementById('dr-from-val').textContent = 'Select date';
  document.getElementById('dr-from-val').classList.add('placeholder');
  document.getElementById('dr-to-val').textContent = 'Select date';
  document.getElementById('dr-to-val').classList.add('placeholder');
  renderTx();
};

window.selectRangeCalDay = (y,m,d) => {
  const picked = new Date(y,m,d);
  if (datePickTarget === 'from') {
    dateFrom = picked;
    const fLbl = picked.toLocaleDateString('en-US', { day:'numeric', month:'short' });
    document.getElementById('dr-from-val').textContent = fLbl;
    document.getElementById('dr-from-val').classList.remove('placeholder');
    if (dateTo && dateTo < dateFrom) {
      dateTo = null;
      document.getElementById('dr-to-val').textContent = 'Select date';
      document.getElementById('dr-to-val').classList.add('placeholder');
    }
  } else {
    dateTo = picked;
    const tLbl = picked.toLocaleDateString('en-US', { day:'numeric', month:'short' });
    document.getElementById('dr-to-val').textContent = tLbl;
    document.getElementById('dr-to-val').classList.remove('placeholder');
    if (dateFrom && dateFrom > dateTo) {
      dateFrom = null;
      document.getElementById('dr-from-val').textContent = 'Select date';
      document.getElementById('dr-from-val').classList.add('placeholder');
    }
  }
  document.getElementById('cal-backdrop').classList.remove('visible');
  document.getElementById('cal-sheet').classList.remove('visible');
  renderTx();
};

function renderRangeCalGrid() {
  const year = calTempDate.getFullYear(); const month = calTempDate.getMonth();
  document.getElementById('cal-month-lbl').textContent = calTempDate.toLocaleDateString('en-US', { month:'long', year:'numeric' });
  
  const firstDay = new Date(year, month, 1).getDay();
  const numDays = new Date(year, month + 1, 0).getDate();
  const now = new Date(); now.setHours(0,0,0,0);

  let html = '';
  for (let i = 0; i < firstDay; i++) { html += '<div></div>'; }
  for (let d = 1; d <= numDays; d++) {
    const cur = new Date(year, month, d);
    let cls = 'cal-day past';
    if (cur > now) cls = 'cal-day future';
    else if (cur.getTime() === now.getTime()) cls = 'cal-day today';
    
    if (dateFrom && cur.toDateString() === dateFrom.toDateString()) cls += ' sel';
    if (dateTo && cur.toDateString() === dateTo.toDateString()) cls += ' sel';
    if (dateFrom && dateTo && cur > dateFrom && cur < dateTo) cls += ' in-range';

    const click = cur <= now ? `onclick="selectRangeCalDay(${year},${month},${d})"` : '';
    html += `<div class="${cls}" ${click}>${d}</div>`;
  }
  document.getElementById('cal-days').innerHTML = html;
}

// ── PWA STANDALONE INTERFACING ──
if (window.navigator.standalone === true) {
  document.body.classList.add('pwa');
}

// ── VISUAL VIEWPORT RESIZE MANAGEMENT ──
if (window.visualViewport) {
  const nav = document.querySelector('.bnav');
  window.visualViewport.addEventListener('resize', () => {
    if (!nav) return;
    
    // Skip calculation shifts if user is inside full screen edit workflow overlay layout.
    if (document.getElementById('s-edit').classList.contains('active')) {
      return;
    }
    
    const keyboardHeight = window.innerHeight - window.visualViewport.height;
    nav.style.transform = `translateX(-50%) translateY(${Math.max(0, keyboardHeight)}px)`;
  });
}

// ── EXPOSE RE-DOCK LOGIC TO WINDOW GLOBALS ──
window.openCal = openCal;
window.closeCal = closeCal;
window.calChangeMonth = calChangeMonth;
window.selectCalDay = selectCalDay;
window.toggleDateRange = toggleDateRange;
window.openDateRangePicker = openDateRangePicker;
window.clearDateRange = clearDateRange;
window.selectRangeCalDay = selectRangeCalDay;

// ── TOAST ──
window.toast = (msg) => {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 1800);
};
</script>

    <button class="cal-nav-btn" onclick="calChangeMonth(-1)"><i class="ti ti-chevron-left"></i></button>

  </div>
  <div class="cal-day-hdrs">
    <div class="cal-day-hdr">S</div><div class="cal-day-hdr">M</div><div class="cal-day-hdr">T</div><div class="cal-day-hdr">W</div><div class="cal-day-hdr">T</div><div class="cal-day-hdr">F</div><div class="cal-day-hdr">S</div>
  </div>
  <div class="cal-days" id="cal-days"></div>
</div>

</body>
